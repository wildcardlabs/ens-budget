name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
        viem: ['2.21.0', 'latest']
    name: node ${{ matrix.node }} · viem ${{ matrix.viem }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm i --no-save viem@${{ matrix.viem }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  mainnet:
    runs-on: ubuntu-latest
    name: mainnet (live + fork)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: npm run test:live
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
      - run: npm run test:fork
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
